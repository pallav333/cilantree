<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <defs>
    <!-- 6-Petal Flower Motif -->
    <g id="flower">
      <path d="M 0,0 C -11,-12 -13,-26 0,-34 C 13,-26 11,-12 0,0 Z" />
      <path d="M 0,0 C -11,-12 -13,-26 0,-34 C 13,-26 11,-12 0,0 Z" transform="rotate(60)" />
      <path d="M 0,0 C -11,-12 -13,-26 0,-34 C 13,-26 11,-12 0,0 Z" transform="rotate(120)" />
      <path d="M 0,0 C -11,-12 -13,-26 0,-34 C 13,-26 11,-12 0,0 Z" transform="rotate(180)" />
      <path d="M 0,0 C -11,-12 -13,-26 0,-34 C 13,-26 11,-12 0,0 Z" transform="rotate(240)" />
      <path d="M 0,0 C -11,-12 -13,-26 0,-34 C 13,-26 11,-12 0,0 Z" transform="rotate(300)" />
    </g>

    <!-- 4-Arch Cross Motif (Square + 4 Pointed Arches) -->
    <g id="arch-cross">
      <rect x="-7" y="-7" width="14" height="14" rx="1" />
      <path d="M -7,-7 H 7 V -16 C 7,-23 0,-28 0,-28 C 0,-28 -7,-23 -7,-16 Z" />
      <path d="M -7,-7 H 7 V -16 C 7,-23 0,-28 0,-28 C 0,-28 -7,-23 -7,-16 Z" transform="rotate(90)" />
      <path d="M -7,-7 H 7 V -16 C 7,-23 0,-28 0,-28 C 0,-28 -7,-23 -7,-16 Z" transform="rotate(180)" />
      <path d="M -7,-7 H 7 V -16 C 7,-23 0,-28 0,-28 C 0,-28 -7,-23 -7,-16 Z" transform="rotate(270)" />
    </g>
  </defs>

  <g fill="#333C48">
    <!-- Row 1 (y = 0) -->
    <use href="#flower" x="0" y="0" />
    <use href="#arch-cross" x="70" y="0" />
    <use href="#flower" x="140" y="0" />

    <!-- Row 2 (y = 70) -->
    <use href="#arch-cross" x="0" y="70" />
    <use href="#flower" x="70" y="70" />
    <use href="#arch-cross" x="140" y="70" />

    <!-- Row 3 (y = 140) -->
    <use href="#flower" x="0" y="140" />
    <use href="#arch-cross" x="70" y="140" />
    <use href="#flower" x="140" y="140" />
  </g>
</svg>
